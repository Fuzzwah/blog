# Site settings
title: Fuzzwah's Agentic Coding Learnings
description: Blog posts sharing things I've learned about agentic coding
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://blog.fuzzwah.com" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
future: true  # Show posts with future dates

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
